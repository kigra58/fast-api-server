apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-api-server
  labels:
    app: fast-api-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fast-api-server
  template:
    metadata:
      labels:
        app: fast-api-server
    spec:
      containers:
      - name: fast-api-server
        image: biz4grouptest138/fast-api-server:v1
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: fast-api-secrets
